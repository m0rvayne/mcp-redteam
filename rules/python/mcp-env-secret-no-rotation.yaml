rules:
  - id: mcp-python-env-secret-getenv
    message: >
      Credential entering the process from an environment variable. This is the
      recommended way to supply a secret — it is reported as inventory, not as a
      defect: it tells an auditor which credentials this server holds and what an
      attacker would obtain by reading its environment. Hardcoded secrets are a
      separate finding (MRT005).
    severity: INFO
    languages: [python]
    metadata:
      category: security
      rule_id: MRT021
      confidence: MEDIUM
      owasp: "MCP14: Static Secrets"
    patterns:
      - pattern-either:
          - pattern: os.getenv("$NAME")
          - pattern: os.environ["$NAME"]
          - pattern: os.environ.get("$NAME")
          - pattern: os.environ.get("$NAME", ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: .*(KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL|PRIVATE).*
