rules:
  - id: mcp-python-path-traversal
    message: >
      Tool argument flows to file operation without path normalization.
      Use os.path.realpath() or Path.resolve() and validate with startswith() check.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      rule_id: MRT002
      confidence: HIGH
      owasp: "MCP02: Path Traversal"
    mode: taint
    pattern-sources:
      - pattern: $ARGS["$KEY"]
      - pattern: $ARGS.get("$KEY")
      - pattern: $ARGS.get("$KEY", ...)
      - patterns:
          - pattern: |
              def $FUNC(..., $ARG: str, ...):
                  ...
          - focus-metavariable: $ARG
      - patterns:
          - pattern: |
              def $FUNC(..., $ARG, ...):
                  ...
          - focus-metavariable: $ARG
      - patterns:
          - pattern: |
              async def $FUNC(..., $ARG: str, ...):
                  ...
          - focus-metavariable: $ARG
      - patterns:
          - pattern: |
              async def $FUNC(..., $ARG, ...):
                  ...
          - focus-metavariable: $ARG
    # Sinks are file ACCESS, not path construction. Building a path is not a
    # vulnerability — `Path(name)`, `os.path.join(base, x)` and `base / x` are
    # how every program addresses a file. Taint still reaches these sinks
    # through the constructed variable, so real traversal is unaffected, while
    # the construction-only matches that dominated HIGH findings are gone.
    pattern-sinks:
      - pattern: open($PATH, ...)
        focus-metavariable: $PATH
      - pattern: open(f"...{$PATH}...", ...)
        focus-metavariable: $PATH
      # pathlib access
      - pattern: $PATH.open(...)
        focus-metavariable: $PATH
      - pattern: $PATH.read_text(...)
        focus-metavariable: $PATH
      - pattern: $PATH.read_bytes(...)
        focus-metavariable: $PATH
      - pattern: $PATH.write_text(...)
        focus-metavariable: $PATH
      - pattern: $PATH.write_bytes(...)
        focus-metavariable: $PATH
      - pattern: $PATH.unlink(...)
        focus-metavariable: $PATH
      # os / shutil access
      - pattern: os.remove($PATH)
        focus-metavariable: $PATH
      - pattern: os.unlink($PATH)
        focus-metavariable: $PATH
      - pattern: os.rename($PATH, ...)
        focus-metavariable: $PATH
      - pattern: os.makedirs($PATH, ...)
        focus-metavariable: $PATH
      - pattern: shutil.copy($PATH, ...)
        focus-metavariable: $PATH
      - pattern: shutil.copyfile($PATH, ...)
        focus-metavariable: $PATH
      - pattern: shutil.move($PATH, ...)
        focus-metavariable: $PATH
      - pattern: shutil.rmtree($PATH, ...)
        focus-metavariable: $PATH
    pattern-sanitizers:
      - pattern: os.path.realpath(...)
      - pattern: $X.resolve(...)
      - pattern: os.path.abspath(...)
      # Safe path sources — not user-controlled
      - pattern: Path.home()
      - pattern: Path.home() / ...
      - pattern: Path.home() / ... / ...
      - pattern: Path.home() / ... / ... / ...
      - pattern: Path.home() / ... / ... / ... / ...
      - pattern: shutil.which(...)
      - pattern: os.path.expanduser(...)
      - pattern: os.path.expanduser(...) / ...
      - pattern: Path(__file__)
      - pattern: Path(__file__).parent
      - pattern: Path(__file__).parent / ...
      - pattern: Path(__file__).parent / ... / ...
      - pattern: Path(__file__).parent / ... / ... / ...
      - pattern: os.path.dirname(__file__)
      - pattern: os.path.dirname(os.path.abspath(__file__))
      # Config/data directory patterns
      - pattern: Path.cwd()
      - pattern: Path.cwd() / ...
      - pattern: Path.cwd() / ... / ...
