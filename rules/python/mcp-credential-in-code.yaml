rules:
  - id: mcp-python-credential-in-code
    message: >
      Hardcoded credential detected. Use environment variables (os.environ, os.getenv)
      or a secrets manager instead of embedding credentials in source code.
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      rule_id: MRT005
      confidence: MEDIUM
      owasp: "MCP06: Hardcoded Secrets"
    # Matching is by regex on the metavariables rather than by literal name
    # patterns. The previous form only matched lowercase identifiers, so
    # `API_KEY = "sk-..."` and `TOKEN = "ghp_..."` — the usual convention for
    # constants — were missed entirely.
    pattern-either:
      # 1. A known credential shape, whatever the variable is called.
      - patterns:
          - pattern: $VAR = "$VALUE"
          - metavariable-regex:
              metavariable: $VALUE
              regex: ^(sk-|ghp_|gho_|ghu_|ghs_|ghr_|github_pat_|AKIA|ASIA|xox[baprs]-|AIza).{8,}
          - pattern-not: $VAR = os.environ[...]
          - pattern-not: $VAR = os.environ.get(...)
          - pattern-not: $VAR = os.getenv(...)
      # 2. A credential-looking name holding a non-trivial literal.
      - patterns:
          - pattern: $VAR = "$VALUE"
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i).*(api_?key|api_?secret|secret_?key|password|passwd|access_?token|auth_?token|private_?key|client_?secret|bearer_?token).*
          - metavariable-regex:
              metavariable: $VALUE
              regex: .{8,}
          - pattern-not: $VAR = os.environ[...]
          - pattern-not: $VAR = os.environ.get(...)
          - pattern-not: $VAR = os.getenv(...)
