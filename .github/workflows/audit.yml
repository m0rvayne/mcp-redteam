name: Self-Audit
on: [push]
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . && pip install semgrep
      # The demo server is deliberately vulnerable and the research scripts are
      # standalone CLIs, so both are fixtures rather than product code. Their
      # findings are asserted by the test suite; uploading them here would fill
      # the Security tab with alerts that are supposed to be there.
      - name: Run audit
        run: |
          mkdir -p audit-target
          cp -R mcp_redteam audit-target/
          mcp-redteam scan audit-target --no-llm --format sarif -o results.sarif
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
